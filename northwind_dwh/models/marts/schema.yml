version: 2

models:
  - name: fact_orders
    columns:
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: employee_id
        tests: 
          - relationships:
              arguments:
                to: ref('dim_employees')
                field: employee_id
      - name: ship_via
        tests:
          - relationships:
              arguments:
                to: ref('dim_shippers')
                field: shipper_id
      - name: freight
        tests: 
          - not_null
      - name: montant_total
        tests: 
          - not_null

  - name: dim_products
    columns:
      - name: gamme
        tests:
          - accepted_values:
              arguments:
                values:
                  - "Entrée de gamme"
                  - "Milieu de gamme"
                  - "Premium"
